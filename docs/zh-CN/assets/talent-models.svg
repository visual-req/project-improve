<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="人才模型：T 型、π 型、# 型示意图">
  <rect x="0" y="0" width="960" height="360" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="16" fill="#262626">
    人才模型示意：T / π / # 型
  </text>

  <rect x="60" y="70" width="840" height="260" rx="14" fill="#fafafa" stroke="#f0f0f0"/>

  <rect x="100" y="110" width="240" height="180" rx="12" fill="#ffffff" stroke="#d9d9d9"/>
  <text x="220" y="138" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="13" fill="#262626">T 型</text>
  <path d="M160 165 L280 165" stroke="#1890ff" stroke-width="10" stroke-linecap="round"/>
  <path d="M220 165 L220 250" stroke="#1890ff" stroke-width="10" stroke-linecap="round"/>
  <text x="220" y="278" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#595959">一专多能（深度 + 宽度）</text>

  <rect x="360" y="110" width="240" height="180" rx="12" fill="#ffffff" stroke="#d9d9d9"/>
  <text x="480" y="138" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="13" fill="#262626">π 型</text>
  <path d="M420 165 L540 165" stroke="#52c41a" stroke-width="10" stroke-linecap="round"/>
  <path d="M440 165 L440 250" stroke="#52c41a" stroke-width="10" stroke-linecap="round"/>
  <path d="M520 165 L520 250" stroke="#52c41a" stroke-width="10" stroke-linecap="round"/>
  <text x="480" y="278" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#595959">双深度 + 横向协作</text>

  <rect x="620" y="110" width="240" height="180" rx="12" fill="#ffffff" stroke="#d9d9d9"/>
  <text x="740" y="138" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="13" fill="#262626"># 型</text>
  <path d="M680 170 L800 170" stroke="#faad14" stroke-width="10" stroke-linecap="round"/>
  <path d="M680 215 L800 215" stroke="#faad14" stroke-width="10" stroke-linecap="round"/>
  <path d="M710 150 L710 250" stroke="#faad14" stroke-width="10" stroke-linecap="round"/>
  <path d="M770 150 L770 250" stroke="#faad14" stroke-width="10" stroke-linecap="round"/>
  <text x="740" y="278" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#595959">多深度 + 系统连接</text>
</svg>

