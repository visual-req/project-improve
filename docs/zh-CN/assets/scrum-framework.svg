  <rect x="209" y="222" width="44" height="16" rx="8" fill="#e6f7ff" stroke="#91d5ff" opacity="0.8"/>
  <rect x="209" y="228" width="44" height="16" rx="8" fill="#e6f7ff" stroke="#91d5ff" opacity="0.9"/>
  <rect x="209" y="234" width="44" height="16" rx="8" fill="#e6f7ff" stroke="#91d5ff"/>

  <text x="464" y="160" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#0050b3" font-weight="600">Sprint Backlog</text>
  <rect x="442" y="222" width="44" height="16" rx="8" fill="#e6f7ff" stroke="#91d5ff" opacity="0.85"/>
