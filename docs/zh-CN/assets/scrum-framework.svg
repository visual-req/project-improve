    <g transform="translate(720 53) scale(2) translate(-720 -53)">
      <path d="M720 53 L728 61 L728 45 Z" fill="#ffd591"/>
    </g>
  </g>
  <text x="720" y="165" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#ad4e00" font-weight="600">迭代</text>
  <text x="720" y="185" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#ad4e00">Sprint</text>

  <circle cx="822" cy="67" r="50" fill="#ffffff" stroke="#91d5ff" stroke-width="3"/>
  <text x="822" y="63" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="9" fill="#0050b3" font-weight="600">Daily</text>
  <text x="822" y="77" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="9" fill="#0050b3" font-weight="600">Scrum</text>
  <g transform="rotate(135 822 67)">
    <path d="M822 17 L814 25 L814 9 Z" fill="#0050b3"/>
