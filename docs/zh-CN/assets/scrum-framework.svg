<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-label="Scrum 框架图：中间为迭代横轴，上方为工件底部对齐，下方为活动（Planning/Review/Retrospective），并留出中间迭代循环区域">
