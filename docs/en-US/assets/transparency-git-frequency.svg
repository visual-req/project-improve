<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Git commit frequency: find blockers via cadence breaks">
  <rect x="0" y="0" width="960" height="360" fill="#ffffff" />
  <text x="480" y="34" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="16" fill="#262626">Git commit frequency: find blockers via cadence breaks (valley / burst / merge stalls)</text>

  <rect x="70" y="70" width="820" height="230" rx="10" fill="#fafafa" stroke="#f0f0f0" />

  <path d="M120 270 L120 110" stroke="#bfbfbf" stroke-width="2" />
  <path d="M120 270 L850 270" stroke="#bfbfbf" stroke-width="2" />
  <text x="98" y="120" text-anchor="end" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#595959">Commits</text>

  <rect x="155" y="210" width="22" height="60" fill="#91d5ff" />
  <rect x="190" y="190" width="22" height="80" fill="#91d5ff" />
  <rect x="225" y="200" width="22" height="70" fill="#91d5ff" />

  <rect x="300" y="255" width="22" height="15" fill="#ffd591" />
  <rect x="335" y="255" width="22" height="15" fill="#ffd591" />
  <rect x="370" y="255" width="22" height="15" fill="#ffd591" />
  <rect x="405" y="255" width="22" height="15" fill="#ffd591" />

  <rect x="520" y="155" width="22" height="115" fill="#b7eb8f" />
  <rect x="555" y="130" width="22" height="140" fill="#b7eb8f" />
  <rect x="590" y="145" width="22" height="125" fill="#b7eb8f" />
  <rect x="625" y="120" width="22" height="150" fill="#b7eb8f" />

  <rect x="740" y="200" width="22" height="70" fill="#91d5ff" />
  <rect x="775" y="205" width="22" height="65" fill="#91d5ff" />

  <rect x="285" y="108" width="210" height="44" rx="8" fill="#fffbe6" stroke="#ffe58f" />
  <text x="300" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#ad6800">Valley: requirements/env/dependencies</text>
  <text x="300" y="146" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#ad6800">Cadence break: flow is blocked</text>

  <rect x="510" y="92" width="260" height="46" rx="8" fill="#f6ffed" stroke="#b7eb8f" />
  <text x="525" y="112" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#237804">Burst: catch-up delivery / batch merges</text>
  <text x="525" y="130" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#237804">Risk: quality backflow / integration pressure</text>

  <rect x="710" y="112" width="240" height="46" rx="8" fill="#e6f7ff" stroke="#91d5ff" />
  <text x="725" y="132" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#0050b3">Commits but no merges: review/gates</text>
  <text x="725" y="150" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#0050b3">Validate: review latency / CI failures</text>

  <text x="140" y="294" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#595959">Week 1</text>
  <text x="320" y="294" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#595959">Week 2</text>
  <text x="560" y="294" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#595959">Week 3</text>
  <text x="760" y="294" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#595959">Week 4</text>
</svg>