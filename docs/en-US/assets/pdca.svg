<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
  <defs>
    <style>
      .title { font: 600 18px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #262626; }
      .text { font: 13px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #262626; }
      .muted { font: 12px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #595959; }
      .box { fill: #ffffff; stroke: #d9d9d9; stroke-width: 1; }
      .arrow { stroke: #8c8c8c; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .p { fill: #e6f4ff; stroke: #91caff; }
      .d { fill: #f6ffed; stroke: #b7eb8f; }
      .c { fill: #fff7e6; stroke: #ffd591; }
      .a { fill: #fff1f0; stroke: #ffccc7; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8c8c8c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="420" fill="#ffffff"/>
  <text x="24" y="42" class="title">PDCA Continuous Improvement Loop</text>
  <text x="24" y="70" class="muted">Turn “problems found” into “verifiable process improvements”: define goals → implement change → validate with data → standardize or adjust</text>

  <rect x="90" y="110" width="320" height="110" rx="14" class="box p"/>
  <text x="120" y="145" class="text">P (Plan)</text>
  <text x="120" y="172" class="muted">- Clarify problem and goal (metric/threshold/window)</text>
  <text x="120" y="193" class="muted">- Define improvement plan and acceptance criteria</text>
  <text x="120" y="214" class="muted">- Mark risks/dependencies/data gaps</text>

  <rect x="570" y="110" width="320" height="110" rx="14" class="box d"/>
  <text x="600" y="145" class="text">D (Do)</text>
  <text x="600" y="172" class="muted">- Minimal viable change (process/tools/automation)</text>
  <text x="600" y="193" class="muted">- Record actual execution and deviations</text>
  <text x="600" y="214" class="muted">- Keep cadence and rollbackable</text>

  <rect x="570" y="250" width="320" height="110" rx="14" class="box c"/>
  <text x="600" y="285" class="text">C (Check)</text>
  <text x="600" y="312" class="muted">- Compare windows and validate metric changes</text>
  <text x="600" y="333" class="muted">- Sampling audit / process checkpoints</text>
  <text x="600" y="354" class="muted">- Identify side effects and new risks</text>

  <rect x="90" y="250" width="320" height="110" rx="14" class="box a"/>
  <text x="120" y="285" class="text">A (Act)</text>
  <text x="120" y="312" class="muted">- Standardize effective practices (rules/policies/automation)</text>
  <text x="120" y="333" class="muted">- If ineffective, go back to Plan and revise hypothesis</text>
  <text x="120" y="354" class="muted">- Turn learning into reusable assets</text>

  <path d="M410,165 C470,165 510,165 570,165" class="arrow" marker-end="url(#arrowHead)"/>
  <path d="M730,220 C730,230 730,240 730,250" class="arrow" marker-end="url(#arrowHead)"/>
  <path d="M570,305 C510,305 470,305 410,305" class="arrow" marker-end="url(#arrowHead)"/>
  <path d="M250,250 C250,240 250,230 250,220" class="arrow" marker-end="url(#arrowHead)"/>
</svg>
