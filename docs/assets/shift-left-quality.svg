<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="质量左移：把质量门禁前移到需求-设计-编码-评审-CI">
  <rect x="0" y="0" width="960" height="360" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="16" fill="#262626">
    质量左移：从“后段拦截”走向“前段预防”
  </text>

  <rect x="60" y="78" width="840" height="230" rx="14" fill="#fafafa" stroke="#f0f0f0"/>

  <rect x="90" y="120" width="150" height="70" rx="12" fill="#e6f7ff" stroke="#91d5ff"/>
  <text x="165" y="150" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#0050b3">需求澄清</text>
  <text x="165" y="172" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#0050b3">验收清单/DoD</text>

  <rect x="260" y="120" width="150" height="70" rx="12" fill="#f6ffed" stroke="#b7eb8f"/>
  <text x="335" y="150" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#237804">设计</text>
  <text x="335" y="172" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#237804">拆分/契约/可测性</text>

  <rect x="430" y="120" width="150" height="70" rx="12" fill="#fff7e6" stroke="#ffd591"/>
  <text x="505" y="150" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#ad4e00">编码</text>
  <text x="505" y="172" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#ad4e00">约束/小步重构</text>

  <rect x="600" y="120" width="150" height="70" rx="12" fill="#fff1f0" stroke="#ffa39e"/>
  <text x="675" y="150" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#a8071a">评审与 CI</text>
  <text x="675" y="172" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#a8071a">门禁/扫描/测试</text>

  <rect x="770" y="120" width="110" height="70" rx="12" fill="#f9f0ff" stroke="#d3adf7"/>
  <text x="825" y="150" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#531dab">测试/发布/线上</text>
  <text x="825" y="172" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#531dab">最后防线</text>

  <path d="M240 155 L260 155" stroke="#8c8c8c" stroke-width="2"/>
  <path d="M410 155 L430 155" stroke="#8c8c8c" stroke-width="2"/>
  <path d="M580 155 L600 155" stroke="#8c8c8c" stroke-width="2"/>
  <path d="M750 155 L770 155" stroke="#8c8c8c" stroke-width="2"/>

  <path d="M258 155 L248 149 L248 161 Z" fill="#8c8c8c"/>
  <path d="M428 155 L418 149 L418 161 Z" fill="#8c8c8c"/>
  <path d="M598 155 L588 149 L588 161 Z" fill="#8c8c8c"/>
  <path d="M768 155 L758 149 L758 161 Z" fill="#8c8c8c"/>

  <rect x="140" y="215" width="700" height="70" rx="12" fill="#ffffff" stroke="#d9d9d9"/>
  <text x="160" y="242" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#262626">把质量门禁前移：越早发现越便宜</text>
  <text x="160" y="264" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#595959">对应信号：缺陷逃逸率↓、重开率↓、CI 成功率↑、代码扫描通过率↑、交付周期↓</text>
</svg>

