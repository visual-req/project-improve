  <path d="M850 187 C900 187 900 150 780 150" fill="none" stroke="#bfbfbf" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M788 150 L798 144 L798 156 Z" fill="#bfbfbf"/>
  <text x="905" y="152" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#8c8c8c">失败→定位→修复→再提交</text>

  <rect x="70" y="450" width="1130" height="70" rx="12" fill="#ffffff" stroke="#d9d9d9"/>
  <text x="92" y="478" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#262626">门禁与度量（用于问题发现与改进验证）</text>
  <text x="92" y="502" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#595959">- 门禁：无新增 blocker、覆盖率下限、关键用例通过、扫描通过（可配置阈值与豁免流程）</text>
  <text x="92" y="524" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#595959">- 指标：流水线耗时/成功率、门禁通过率、发布频率、变更失败率、MTTR、抖动率/重试率</text>
</svg>
