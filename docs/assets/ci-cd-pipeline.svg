<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="CI/CD 流水线：更丰富的分区展示（PR/CI/CD/观测），包含门禁、发布策略与度量">
  <rect x="0" y="0" width="1280" height="560" fill="#ffffff"/>
  <text x="640" y="34" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="16" fill="#262626">
    CI/CD：把质量门禁放进流水线，用快速反馈减少返工
  </text>

  <rect x="40" y="70" width="1200" height="460" rx="14" fill="#fafafa" stroke="#f0f0f0"/>

  <rect x="70" y="105" width="1130" height="160" rx="12" fill="#ffffff" stroke="#d9d9d9"/>
  <text x="92" y="132" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#262626">PR/CI（合并前）：把问题左移到提交与评审阶段</text>

  <rect x="90" y="150" width="120" height="74" rx="12" fill="#e6f7ff" stroke="#91d5ff"/>
  <text x="150" y="178" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#0050b3">Commit/PR</text>
  <text x="150" y="198" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#0050b3">小批量</text>
  <text x="150" y="216" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#0050b3">可回退</text>

  <rect x="220" y="150" width="120" height="74" rx="12" fill="#fff7e6" stroke="#ffd591"/>
  <text x="280" y="178" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#ad4e00">Lint/Type</text>
  <text x="280" y="198" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#ad4e00">秒级反馈</text>
  <text x="280" y="216" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#ad4e00">格式/类型</text>

  <rect x="350" y="150" width="120" height="74" rx="12" fill="#f6ffed" stroke="#b7eb8f"/>
  <text x="410" y="178" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#237804">Unit Test</text>
  <text x="410" y="198" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#237804">保护网</text>
  <text x="410" y="216" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#237804">快速回归</text>

  <rect x="480" y="150" width="140" height="74" rx="12" fill="#fff7e6" stroke="#ffd591"/>
  <text x="550" y="178" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#ad4e00">Build/Package</text>
  <text x="550" y="198" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#ad4e00">可复现</text>
  <text x="550" y="216" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#ad4e00">制品生成</text>

  <rect x="630" y="150" width="140" height="74" rx="12" fill="#f6ffed" stroke="#b7eb8f"/>
  <text x="700" y="178" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#237804">Integration/E2E</text>
  <text x="700" y="198" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#237804">关键链路</text>
  <text x="700" y="216" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#237804">冒烟回归</text>

  <rect x="780" y="150" width="140" height="74" rx="12" fill="#fff1f0" stroke="#ffa39e"/>
  <text x="850" y="178" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#a8071a">Security Scan</text>
  <text x="850" y="198" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#a8071a">SAST/SCA</text>
  <text x="850" y="216" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#a8071a">密钥/许可证</text>

  <rect x="930" y="150" width="130" height="74" rx="12" fill="#fff1f0" stroke="#ffa39e"/>
  <text x="995" y="178" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#a8071a">Quality Gate</text>
  <text x="995" y="198" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#a8071a">阈值放行</text>
  <text x="995" y="216" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#a8071a">可追责</text>

  <rect x="1070" y="150" width="110" height="74" rx="12" fill="#e6f7ff" stroke="#91d5ff"/>
  <text x="1125" y="178" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#0050b3">Merge</text>
  <text x="1125" y="198" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#0050b3">主干稳定</text>
  <text x="1125" y="216" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#0050b3">可发布</text>

  <path d="M210 187 L220 187" stroke="#8c8c8c" stroke-width="2"/>
  <path d="M340 187 L350 187" stroke="#8c8c8c" stroke-width="2"/>
  <path d="M470 187 L480 187" stroke="#8c8c8c" stroke-width="2"/>
