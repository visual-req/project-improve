  <path d="M348 187 L340 181 L340 193 Z" fill="#8c8c8c"/>
  <path d="M478 187 L470 181 L470 193 Z" fill="#8c8c8c"/>
  <path d="M628 187 L620 181 L620 193 Z" fill="#8c8c8c"/>
  <path d="M778 187 L770 181 L770 193 Z" fill="#8c8c8c"/>
  <path d="M928 187 L920 181 L920 193 Z" fill="#8c8c8c"/>
  <path d="M1068 187 L1060 181 L1060 193 Z" fill="#8c8c8c"/>

  <rect x="70" y="275" width="1130" height="160" rx="12" fill="#ffffff" stroke="#d9d9d9"/>
  <text x="92" y="302" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#262626">CD（合并后）：用发布策略控制风险，用观测能力缩短 MTTR</text>

  <rect x="90" y="320" width="140" height="74" rx="12" fill="#f9f0ff" stroke="#d3adf7"/>
  <text x="160" y="348" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#531dab">Deploy Staging</text>
  <text x="160" y="368" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#531dab">环境一致</text>
  <text x="160" y="386" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#531dab">自动化</text>

  <rect x="240" y="320" width="130" height="74" rx="12" fill="#f6ffed" stroke="#b7eb8f"/>
  <text x="305" y="348" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#237804">Smoke</text>
  <text x="305" y="368" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#237804">关键用例</text>
  <text x="305" y="386" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#237804">可回滚</text>

  <rect x="380" y="320" width="150" height="74" rx="12" fill="#fff7e6" stroke="#ffd591"/>
  <text x="455" y="348" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#ad4e00">Approval</text>
  <text x="455" y="368" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#ad4e00">可选：变更大</text>
  <text x="455" y="386" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#ad4e00">合规/窗口</text>

  <rect x="540" y="320" width="150" height="74" rx="12" fill="#f9f0ff" stroke="#d3adf7"/>
  <text x="615" y="348" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#531dab">Deploy Prod</text>
  <text x="615" y="368" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#531dab">Canary/灰度</text>
  <text x="615" y="386" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#531dab">Feature Flag</text>

  <rect x="700" y="320" width="150" height="74" rx="12" fill="#e6f7ff" stroke="#91d5ff"/>
  <text x="775" y="348" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#0050b3">Observe</text>
  <text x="775" y="368" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#0050b3">指标/日志/链路</text>
  <text x="775" y="386" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#0050b3">告警</text>

  <rect x="860" y="320" width="150" height="74" rx="12" fill="#fff1f0" stroke="#ffa39e"/>
  <text x="935" y="348" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#a8071a">Rollback</text>
  <text x="935" y="368" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#a8071a">一键回滚</text>
  <text x="935" y="386" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#a8071a">降级预案</text>

  <rect x="1020" y="320" width="160" height="74" rx="12" fill="#ffffff" stroke="#d9d9d9"/>
  <text x="1100" y="348" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#262626">输出</text>
  <text x="1100" y="368" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#595959">发布说明</text>
  <text x="1100" y="386" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#595959">可追踪变更</text>

