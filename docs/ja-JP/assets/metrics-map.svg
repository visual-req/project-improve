<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="段階×タイプで整理したメトリクス">
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="16" fill="#262626">
    メトリクスを段階（横軸）×タイプ（縦軸）で整理
  </text>

  <rect x="160" y="70" width="180" height="44" fill="#fafafa" stroke="#f0f0f0"/>
  <rect x="340" y="70" width="180" height="44" fill="#fafafa" stroke="#f0f0f0"/>
  <rect x="520" y="70" width="180" height="44" fill="#fafafa" stroke="#f0f0f0"/>
  <rect x="700" y="70" width="220" height="44" fill="#fafafa" stroke="#f0f0f0"/>

  <text x="250" y="98" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#595959">要件/計画</text>
  <text x="430" y="98" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#595959">開発/レビュー</text>
  <text x="610" y="98" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#595959">テスト/配信</text>
  <text x="810" y="98" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#595959">本番/運用</text>

  <rect x="40" y="114" width="120" height="94" fill="#f6ffed" stroke="#b7eb8f"/>
  <text x="100" y="142" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#237804">フロー</text>
  <text x="100" y="162" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#237804">配信とフロー</text>

  <rect x="40" y="208" width="120" height="94" fill="#e6f7ff" stroke="#91d5ff"/>
  <text x="100" y="236" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#0050b3">計画</text>
  <text x="100" y="256" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#0050b3">計画の信頼性</text>

  <rect x="40" y="302" width="120" height="94" fill="#fff7e6" stroke="#ffd591"/>
  <text x="100" y="330" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#ad4e00">品質</text>
  <text x="100" y="350" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#ad4e00">欠陥と回帰</text>

  <rect x="40" y="396" width="120" height="94" fill="#fff1f0" stroke="#ffa39e"/>
  <text x="100" y="424" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#a8071a">開発効率</text>
  <text x="100" y="444" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#a8071a">エンジニアリング</text>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#262626">
    <rect x="160" y="114" width="180" height="94" fill="#ffffff" stroke="#f0f0f0"/>
    <text x="170" y="138">スループット</text>
    <text x="170" y="158">WIP / 老化WIP</text>
    <text x="170" y="178">リードタイム</text>

    <rect x="340" y="114" width="180" height="94" fill="#ffffff" stroke="#f0f0f0"/>
    <text x="350" y="138">サイクルタイム</text>
    <text x="350" y="158">レビュー待ち</text>
    <text x="350" y="178">PRサイクル（作成→マージ）</text>

    <rect x="520" y="114" width="180" height="94" fill="#ffffff" stroke="#f0f0f0"/>
    <text x="530" y="138">デプロイ頻度</text>
    <text x="530" y="158">配信バッチサイズ（任意）</text>

    <rect x="700" y="114" width="220" height="94" fill="#ffffff" stroke="#f0f0f0"/>
    <text x="710" y="138">MTTR（任意）</text>
    <text x="710" y="158">変更失敗率（任意）</text>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#262626">
    <rect x="160" y="208" width="180" height="94" fill="#ffffff" stroke="#f0f0f0"/>
    <text x="170" y="232">コミット達成率</text>
    <text x="170" y="252">スコープ変更</text>
    <text x="170" y="272">イテレーションスループット/完了率</text>
    <text x="170" y="292">持ち越し率（任意）</text>

    <rect x="340" y="208" width="180" height="94" fill="#ffffff" stroke="#f0f0f0"/>
    <text x="350" y="232">WIP上限遵守率（任意）</text>
    <text x="350" y="252">ブロック比率（任意）</text>

    <rect x="520" y="208" width="180" height="94" fill="#ffffff" stroke="#f0f0f0"/>
    <text x="530" y="232">期日通り配信率（任意）</text>
    <text x="530" y="252">手戻り比率（任意）</text>

    <rect x="700" y="208" width="220" height="94" fill="#ffffff" stroke="#f0f0f0"/>
    <text x="710" y="232">本番コミット偏差（任意）</text>
    <text x="710" y="252">SLA（任意）</text>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#262626">
    <rect x="160" y="302" width="180" height="94" fill="#ffffff" stroke="#f0f0f0"/>
    <text x="170" y="326">要件欠陥</text>
    <text x="170" y="346">欠陥率</text>
    <text x="170" y="366">—</text>

    <rect x="340" y="302" width="180" height="94" fill="#ffffff" stroke="#f0f0f0"/>
    <text x="350" y="326">コード欠陥</text>
    <text x="350" y="346">レビュー欠陥（任意）</text>
    <text x="350" y="366">テストブロッカー（任意）</text>

    <rect x="520" y="302" width="180" height="94" fill="#ffffff" stroke="#f0f0f0"/>
    <text x="530" y="326">自動テストカバレッジ</text>
    <text x="530" y="346">回帰欠陥（任意）</text>
    <text x="530" y="366">受入失敗率（任意）</text>
    <text x="530" y="386">再オープン率</text>

    <rect x="700" y="302" width="220" height="94" fill="#ffffff" stroke="#f0f0f0"/>
    <text x="710" y="326">逃逸欠陥率</text>
    <text x="710" y="346">本番欠陥重大度（任意）</text>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" fill="#262626">
    <rect x="160" y="396" width="180" height="94" fill="#ffffff" stroke="#f0f0f0"/>
    <text x="170" y="420">コミット頻度（任意）</text>
    <text x="170" y="440">PR↔課題関連率</text>

    <rect x="340" y="396" width="180" height="94" fill="#ffffff" stroke="#f0f0f0"/>
    <text x="350" y="420">PRサイクル</text>
    <text x="350" y="440">レビュー待ち</text>
    <text x="350" y="460">変更規模</text>

    <rect x="520" y="396" width="180" height="94" fill="#ffffff" stroke="#f0f0f0"/>
    <text x="530" y="420">CI統合頻度</text>
    <text x="530" y="440">CI成功率</text>
    <text x="530" y="460">コードスキャン通過率</text>

    <rect x="700" y="396" width="220" height="94" fill="#ffffff" stroke="#f0f0f0"/>
    <text x="710" y="420">オンコール負荷（任意）</text>
    <text x="710" y="440">緊急修正比率（任意）</text>
  </g>
</svg>
